<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Screenshot 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }
        .container {
            display: flex;
            align-items: center;
            width: 1100px;
            justify-content: space-between;
        }
        .phone-mockup {
            width: 320px;
            height: 640px;
            background: #f8f9fa;
            border-radius: 45px;
            border: 10px solid #222;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .phone-content {
            padding: 0;
            text-align: center;
            flex: 1;
        }
        .app-bar {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            color: #333;
        }
        .file-list {
            padding: 15px;
        }
        .file-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            text-align: right;
        }
        .file-icon {
            width: 45px;
            height: 45px;
            background: #e3f2fd;
            color: #1672df;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-left: 15px;
        }
        .text-side {
            width: 550px;
        }
        .text-side h1 {
            font-size: 60px;
            margin: 0;
            line-height: 1.2;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .text-side p {
            font-size: 28px;
            opacity: 0.9;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-side">
            <h1>مدیریت هوشمند فایل‌ها</h1>
            <p>دسترسی سریع به تمام اسناد اسکن شده در یک محیط امن و منظم.</p>
        </div>
        <div class="phone-mockup">
            <div class="phone-content">
                <div class="app-bar">تاریخچه فایل‌ها</div>
                <div class="file-list">
                    <div class="file-card">
                        <div class="file-icon">📄</div>
                        <div style="flex: 1;">
                            <div style="font-weight: bold; color: #333; font-size: 14px;">Contract_2024.pdf</div>
                            <div style="color: #999; font-size: 10px;">امروز • 2.1 MB</div>
                        </div>
                    </div>
                    <div class="file-card">
                        <div class="file-icon">📄</div>
                        <div style="flex: 1;">
                            <div style="font-weight: bold; color: #333; font-size: 14px;">Project_Plan.pdf</div>
                            <div style="color: #999; font-size: 10px;">دیروز • 5.4 MB</div>
                        </div>
                    </div>
                    <div class="file-card">
                        <div class="file-icon">📄</div>
                        <div style="flex: 1;">
                            <div style="font-weight: bold; color: #333; font-size: 14px;">Receipt_110.pdf</div>
                            <div style="color: #999; font-size: 10px;">۳ روز پیش • 800 KB</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
