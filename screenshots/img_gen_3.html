<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Screenshot 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #27AE60 0%, #2ECC71 100%);
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }
        .container {
            display: flex;
            align-items: center;
            width: 1100px;
            justify-content: space-between;
        }
        .phone-mockup {
            width: 320px;
            height: 640px;
            background: #f8f9fa;
            border-radius: 45px;
            border: 10px solid #222;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .phone-content {
            padding: 20px;
            text-align: center;
            flex: 1;
        }
        .success-box {
            margin-top: 60px;
            background: white;
            padding: 30px 15px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .check-circle {
            width: 70px;
            height: 70px;
            background: #e8f5e9;
            color: #27AE60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 15px;
        }
        .btn {
            background: #27AE60;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 30px;
            font-weight: bold;
        }
        .text-side {
            width: 550px;
        }
        .text-side h1 {
            font-size: 60px;
            margin: 0;
            line-height: 1.2;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .text-side p {
            font-size: 28px;
            opacity: 0.9;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-side">
            <h1>فایل شما آماده است!</h1>
            <p>اشتراک‌گذاری سریع و چاپ مستقیم اسناد با بهترین کیفیت ممکن.</p>
        </div>
        <div class="phone-mockup">
            <div class="phone-content">
                <div style="height: 20px;"></div>
                <div style="font-weight: bold; color: #333;">فایل آماده است</div>
                <div class="success-box">
                    <div class="check-circle">✓</div>
                    <div style="color: #27AE60; font-weight: bold;">تبدیل موفقیت‌آمیز</div>
                    <div style="color: #666; font-size: 12px; margin-top: 10px;">Document_Final.pdf</div>
                </div>
                <div class="btn">اشتراک‌گذاری فایل</div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <div style="background: white; flex: 1; padding: 12px; border-radius: 10px; color: #333; border: 1px solid #ddd;">مشاهده</div>
                    <div style="background: white; flex: 1; padding: 12px; border-radius: 10px; color: #333; border: 1px solid #ddd;">چاپ</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
